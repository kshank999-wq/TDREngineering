<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TDR Engineering">
  <!--
    Browser-tab icon. Matches the "TDR" tile the site header renders while the
    official logo is outstanding (see TODO(tdr) in src/components/site-header.tsx)
    so the tab and the header agree.

    Full-bleed rather than a rounded card: at 16px a corner radius reads as
    fuzz, and the browser rounds the tab icon itself. Letters are set wide and
    heavy for the same reason — three characters at 16px only survive if they
    fill the square.

    TODO(tdr): replace with the official mark once the logo files are
    recovered, and add an apple-icon.png alongside for iOS home screens.
  -->
  <rect width="100" height="100" fill="#0f3d5c"/>
  <text x="50" y="50"
        fill="#ffffff"
        font-family="Archivo, Helvetica, Arial, sans-serif"
        font-size="40"
        font-weight="700"
        letter-spacing="-2"
        text-anchor="middle"
        dominant-baseline="central">TDR</text>
</svg>
